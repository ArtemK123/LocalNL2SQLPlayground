[project]
name = "doris-test-harness"
version = "0.1.0"
description = "Dual-DSN harness for doris-test (PG gold, Doris pred)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.2",
  "pymysql>=1.1",
]

[project.scripts]
doris-test-harness = "doris_test_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["doris_test_harness*"]

[tool.setuptools.package-dir]
"" = "src"
