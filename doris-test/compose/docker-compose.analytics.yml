# Analytics: Kafka + Debezium + Doris (remote PostgreSQL on DB host). No local PG/Mongo.
name: doris-test-analytics

networks:
  doris-test-net:
    external: true
    name: doris-test-net
  doris_internal:
    name: doris-test-doris-internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  kafka_data:
  doris_fe_meta:
  doris_be_storage:

services:
  kafka:
    image: docker.io/bitnamilegacy/kafka:3.7.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: ZGI1NTk0YmVkNjYwN2Q0T
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - doris-test-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  connect:
    image: quay.io/debezium/connect:3.0.0.Final
    ports:
      - "${CONNECT_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: doris-test-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - doris-test-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  connect-register:
    image: curlimages/curl:8.5.0
    environment:
      BIRD_PG_HOST: ${BIRD_PG_HOST:-bird-postgres}
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      - ../stack/connectors:/connectors:ro
    entrypoint: ["/bin/sh", "/connectors/register.sh"]
    networks:
      - doris-test-net

  doris-fe:
    image: apache/doris:doris-fe-2.1.7
    hostname: fe
    networks:
      doris-test-net:
      doris_internal:
        ipv4_address: 172.29.0.10
    ports:
      - "${DORIS_HTTP_PORT:-8030}:8030"
      - "${DORIS_QUERY_PORT:-9030}:9030"
    environment:
      FE_SERVERS: fe1:172.29.0.10:9010
      FE_ID: 1
    volumes:
      - doris_fe_meta:/opt/apache-doris/fe/doris-meta
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8030/api/bootstrap || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  doris-be:
    image: apache/doris:doris-be-2.1.7
    hostname: be
    networks:
      doris-test-net:
      doris_internal:
        ipv4_address: 172.29.0.11
    ports:
      - "${DORIS_BE_HTTP_PORT:-8040}:8040"
    environment:
      FE_SERVERS: fe1:172.29.0.10:9010
      BE_ADDR: 172.29.0.11:9050
      SKIP_CHECK_ULIMIT: "true"
    volumes:
      - doris_be_storage:/opt/apache-doris/be/storage
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655350
        hard: 655350
      nproc:
        soft: 655350
        hard: 655350
    depends_on:
      doris-fe:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8040/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  doris-init:
    image: mysql:8.4
    networks:
      - doris_internal
    depends_on:
      doris-be:
        condition: service_healthy
      connect-register:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    volumes:
      - ../stack/doris:/doris:ro
      - ../stack/scripts/doris-init.sh:/doris-init.sh:ro
    entrypoint: ["/bin/bash", "/doris-init.sh"]
