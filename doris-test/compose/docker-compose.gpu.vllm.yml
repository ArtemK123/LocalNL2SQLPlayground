# GPU role: vLLM OpenAI-compatible server for Arctic Text2SQL (doris-test).
# Host port 11434 → container :8000 so existing SG (nl2sql→gpu:11434) stays unchanged.

name: doris-test-gpu-vllm

networks:
  doris-test-net:
    external: true
    name: doris-test-net

volumes:
  vllm_hf_cache:

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    ports:
      - "${VLLM_HOST_PORT:-11434}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - vllm_hf_cache:/root/.cache/huggingface
    command:
      - Snowflake/Arctic-Text2SQL-R1-7B
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-4096}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.90}"
      - --dtype
      - "${VLLM_DTYPE:-auto}"
      - --enable-prefix-caching
      - --served-model-name
      - "${VLLM_SERVED_MODEL_NAME:-Snowflake/Arctic-Text2SQL-R1-7B}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8000/v1/models >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 900s
    networks:
      - doris-test-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
