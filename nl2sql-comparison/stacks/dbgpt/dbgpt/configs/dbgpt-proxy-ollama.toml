[system]
language = "${env:DBGPT_LANG:-en}"
api_keys = []
encrypt_key = "local_dbgpt_secret"

[service.web]
host = "0.0.0.0"
port = 5670

[service.web.database]
type = "sqlite"
path = "pilot/meta_data/dbgpt.db"

[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

[models]
[[models.llms]]
name = "${env:LLM_MODEL_NAME:-qwen2.5:3b-instruct}"
provider = "proxy/ollama"
api_base = "${env:OLLAMA_API_BASE:-http://ollama:11434}"
api_key = ""

[[models.embeddings]]
name = "${env:EMBEDDING_MODEL_NAME:-nomic-embed-text}"
provider = "proxy/ollama"
api_url = "${env:OLLAMA_API_BASE:-http://ollama:11434}"
api_key = ""
