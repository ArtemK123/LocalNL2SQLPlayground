# DB role: PostgreSQL 16 + BIRD init scripts. Creates shared network nl2sql-comparison-net.
# Local harness: scripts/local/load_bird_1db.ps1 (formula_1 / public)
# Full MINIDEV: scripts/local/load_bird_dev.ps1

name: nl2sql-comparison-db

networks:
  nl2sql-comparison-net:
    name: nl2sql-comparison-net
    driver: bridge

volumes:
  bird_pg_data:

services:
  bird-postgres:
    container_name: bird-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${BIRD_PG_USER:-bird}
      POSTGRES_PASSWORD: ${BIRD_PG_PASSWORD:-bird}
      POSTGRES_DB: ${BIRD_PG_DB:-bird}
    ports:
      - "${BIRD_PG_PORT:-55432}:5432"
    volumes:
      - bird_pg_data:/var/lib/postgresql/data
      - ../stack/bird/init/00_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ../stack/bird/init/01_olap_compat.sql:/docker-entrypoint-initdb.d/01_olap_compat.sql:ro
      - ../stack/bird/init/02_bird_dump_owner.sql:/docker-entrypoint-initdb.d/02_bird_dump_owner.sql:ro
      - ../stack/bird/init/z01_load_seed_sql.sh:/docker-entrypoint-initdb.d/z01_load_seed_sql.sh:ro
      - ../stack/bird/init/z99_grants.sh:/docker-entrypoint-initdb.d/z99_grants.sh:ro
      - ../stack/bird/seed:/docker-entrypoint-initdb.d/seed:ro
    networks:
      - nl2sql-comparison-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
