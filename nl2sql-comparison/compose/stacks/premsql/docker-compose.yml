# PremSQL — AgentServer + Django playground API + Streamlit UI (remote Postgres + Ollama).

name: nl2sql-comparison-premsql

networks:
  nl2sql-comparison-net:
    external: true
    name: nl2sql-comparison-net

services:
  premsql-api:
    build:
      context: ../../../stacks/premsql/premsql_api
    ports:
      - "${PREMSQL_API_PORT:-8010}:8010"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8010"
      PREMSQL_AGENT_ADVERTISE_HOST: premsql-api
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      PREMSQL_TEXT2SQL_MODEL: ${OLLAMA_PRIMARY_MODEL:-qwen2.5:7b-instruct}
      PREMSQL_ANALYSIS_MODEL: ${OLLAMA_FALLBACK_MODEL:-qwen2.5:7b-instruct}
      PREMSQL_SESSION_NAME: ${PREMSQL_SESSION_NAME:-bird_minidev}
      PREMSQL_DB_URI: postgresql+psycopg://${BIRD_OLAP_USER:-olap}:${BIRD_OLAP_PASSWORD:-olap}@${BIRD_PG_HOST:-bird-postgres}:5432/${BIRD_PG_DB:-bird}
      PREMSQL_AUTO_FILTER_TABLES: ${PREMSQL_AUTO_FILTER_TABLES:-true}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - nl2sql-comparison-net

  premsql-playground-api:
    build:
      context: ../../../stacks/premsql/playground
    ports:
      - "${PREMSQL_PLAYGROUND_API_PORT:-8000}:8000"
    environment:
      PREMSQL_PLAYGROUND_API_HOST: 0.0.0.0
      PREMSQL_PLAYGROUND_API_PORT: "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/session/list/?page=1&page_size=1', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - nl2sql-comparison-net

  premsql-playground-ui:
    build:
      context: ../../../stacks/premsql/playground
    command:
      - python
      - -m
      - streamlit
      - run
      - run_playground_ui.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.maxUploadSize=500
      - --browser.gatherUsageStats=false
    ports:
      - "${PREMSQL_PLAYGROUND_PORT:-8501}:8501"
    environment:
      PREMSQL_BACKEND_API_URL: http://premsql-playground-api:8000/api
      PREMSQL_PLAYGROUND_PORT: "8501"
    depends_on:
      premsql-playground-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      - nl2sql-comparison-net

  premsql-playground-init:
    build:
      context: ../../../stacks/premsql/playground
    command: ["python", "register_agent_session.py"]
    environment:
      PREMSQL_BACKEND_API_URL: http://premsql-playground-api:8000/api
      PREMSQL_AGENT_URL: http://premsql-api:8010
    depends_on:
      premsql-api:
        condition: service_healthy
      premsql-playground-api:
        condition: service_healthy
      premsql-playground-ui:
        condition: service_started
    restart: "no"
    networks:
      - nl2sql-comparison-net
